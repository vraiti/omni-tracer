<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omni-tracer object hierarchy</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
  font-size: 13px;
  background: #0e0e0e;
  color: #d4d4d4;
  min-height: 100vh;
}

#controls {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

#controls label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

#controls input[type="text"] {
  background: #0e0e0e;
  border: 1px solid #444;
  color: #d4d4d4;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 13px;
  width: 220px;
}

#controls input[type="checkbox"] {
  accent-color: #5a9;
}

#file-input-label {
  background: #2a2a2a;
  border: 1px solid #555;
  padding: 4px 12px;
  cursor: pointer;
  display: inline-block;
}

#file-input-label:hover { background: #333; }

#file-input { display: none; }

#stats {
  color: #888;
  font-size: 12px;
}

#drop-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 50px);
  color: #555;
  font-size: 16px;
}

#drop-zone.drag-over {
  background: #1a1a2a;
  color: #88a;
}

#hierarchy {
  padding: 16px;
  display: none;
  position: relative;
}

.process-box {
  border: 2px solid #4a7a9a;
  margin-bottom: 12px;
  padding: 0;
  background: #111;
}

.process-label {
  background: #4a7a9a;
  color: #000;
  padding: 4px 10px;
  font-weight: bold;
  font-size: 12px;
}

.process-children {
  padding: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: flex-start;
  align-content: flex-start;
}

.obj-box {
  border: 1px solid #444;
  padding: 0;
  min-width: 120px;
  max-width: 100%;
}

.obj-box .obj-label {
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  user-select: none;
}

.obj-box.collapsed > .obj-children { display: none; }
.obj-box.collapsed > .obj-label::before { content: "\25b6 "; font-size: 9px; }

.obj-box .obj-children {
  padding: 4px 6px 6px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: flex-start;
  align-content: flex-start;
}

.obj-ref {
  border: 1px dashed #555;
  padding: 3px 8px;
  font-style: italic;
  font-size: 11px;
  color: #888;
  white-space: nowrap;
  cursor: pointer;
}

.obj-ref:hover { color: #aaa; border-color: #888; }

/* depth colors */
.depth-0 { background: #1a1a1a; }
.depth-0 > .obj-label { color: #7cb; }
.depth-1 { background: #1e1e22; }
.depth-1 > .obj-label { color: #a9c; }
.depth-2 { background: #22222a; }
.depth-2 > .obj-label { color: #ca9; }
.depth-3 { background: #262630; }
.depth-3 > .obj-label { color: #9ca; }
.depth-4 { background: #2a2a36; }
.depth-4 > .obj-label { color: #ac9; }
.depth-5 { background: #2e2e3c; }
.depth-5 > .obj-label { color: #9ac; }
.depth-6 { background: #323242; }
.depth-6 > .obj-label { color: #c9a; }

.hidden { display: none !important; }

.tooltip {
  position: fixed;
  background: #222;
  border: 1px solid #555;
  padding: 8px 12px;
  font-size: 11px;
  max-width: 500px;
  z-index: 200;
  pointer-events: none;
  line-height: 1.6;
  word-break: break-all;
}

.tooltip .tt-key { color: #888; }
.tooltip .tt-val { color: #d4d4d4; }

#loading {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  z-index: 300;
  align-items: center;
  justify-content: center;
  color: #888;
  font-size: 16px;
}

#edge-svg {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 50;
  overflow: visible;
}

#edge-svg path {
  fill: none;
  stroke: #5a9;
  stroke-width: 1.5;
  opacity: 0.7;
}

#edge-svg path.edge-highlight {
  stroke: #8cf;
  stroke-width: 2.5;
  opacity: 1;
}

#edge-svg marker path {
  fill: #5a9;
  stroke: none;
}
</style>
</head>
<body>

<div id="controls" class="hidden">
  <label id="file-input-label">
    Load trace
    <input type="file" id="file-input" accept=".json">
  </label>
  <input type="text" id="filter-input" placeholder="Filter by class name...">
  <label>
    <input type="checkbox" id="show-isolated">
    Show isolated objects
  </label>
  <div style="position: relative; display: inline-block;">
    <button id="exclude-btn" style="background:#2a2a2a; border:1px solid #555; color:#d4d4d4; padding:4px 12px; cursor:pointer; font-family:inherit; font-size:13px;">Exclude classes ▾</button>
    <div id="exclude-panel" class="hidden" style="position:absolute; top:100%; left:0; background:#1a1a1a; border:1px solid #555; max-height:400px; overflow-y:auto; z-index:150; min-width:280px; padding:6px 0;">
      <div style="padding:4px 10px; border-bottom:1px solid #333;">
        <input type="text" id="exclude-filter" placeholder="Search classes..." style="background:#0e0e0e; border:1px solid #444; color:#d4d4d4; padding:3px 6px; font-family:inherit; font-size:12px; width:100%;">
      </div>
      <div id="exclude-list" style="padding:4px 0;"></div>
    </div>
  </div>
  <div style="position: relative; display: inline-block;">
    <button id="pin-root-btn" style="background:#2a2a2a; border:1px solid #555; color:#d4d4d4; padding:4px 12px; cursor:pointer; font-family:inherit; font-size:13px;">Roots ▾</button>
    <div id="pin-root-panel" class="hidden" style="position:absolute; top:100%; left:0; background:#1a1a1a; border:1px solid #555; max-height:400px; overflow-y:auto; z-index:150; min-width:280px; padding:6px 0;">
      <div style="padding:4px 10px; border-bottom:1px solid #333;">
        <input type="text" id="pin-root-filter" placeholder="Search classes..." style="background:#0e0e0e; border:1px solid #444; color:#d4d4d4; padding:3px 6px; font-family:inherit; font-size:12px; width:100%;">
      </div>
      <div id="pin-root-list" style="padding:4px 0;"></div>
    </div>
  </div>
  <span id="stats"></span>
</div>

<div id="drop-zone">
  Drop a trace JSON here, or click to load
  <input type="file" id="file-input-drop" accept=".json" style="display:none">
</div>

<div id="hierarchy"></div>

<div id="loading">Parsing trace...</div>

<div id="tooltip" class="tooltip hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/elkjs@0.10.0/lib/elk.bundled.js"></script>
<script>
const dropZone = document.getElementById("drop-zone");
const hierarchy = document.getElementById("hierarchy");
const controls = document.getElementById("controls");
const filterInput = document.getElementById("filter-input");
const showIsolated = document.getElementById("show-isolated");
const statsEl = document.getElementById("stats");
const fileInput = document.getElementById("file-input");
const fileInputDrop = document.getElementById("file-input-drop");
const loading = document.getElementById("loading");
const tooltip = document.getElementById("tooltip");

const elk = new ELK();

let traceData = null;
let traceFileName = null;
let parentMap = {};
let rendered = {};
let collapsedSet = new Set();
let excludedClasses = new Set();
let pinnedRootClasses = new Set();
let refEdges = [];

function configKey() {
  return "omni-tracer:" + (traceFileName || "unknown");
}

function loadConfig() {
  try {
    const raw = localStorage.getItem(configKey());
    if (raw) {
      const cfg = JSON.parse(raw);
      collapsedSet = new Set(cfg.collapsed || []);
      excludedClasses = new Set(cfg.excluded || []);
      pinnedRootClasses = new Set(cfg.pinnedRoots || []);
    } else {
      collapsedSet = new Set();
      excludedClasses = new Set();
      pinnedRootClasses = new Set();
    }
  } catch {
    collapsedSet = new Set();
    excludedClasses = new Set();
    pinnedRootClasses = new Set();
  }
}

function saveConfig() {
  try {
    localStorage.setItem(configKey(), JSON.stringify({
      collapsed: Array.from(collapsedSet),
      excluded: Array.from(excludedClasses),
      pinnedRoots: Array.from(pinnedRootClasses),
    }));
  } catch {}
}

function toggleCollapse(uuid, box) {
  if (collapsedSet.has(uuid)) {
    collapsedSet.delete(uuid);
    box.classList.remove("collapsed");
  } else {
    collapsedSet.add(uuid);
    box.classList.add("collapsed");
  }
  saveConfig();
  scheduleEdgeLayout();
}

dropZone.addEventListener("click", () => fileInputDrop.click());
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

fileInputDrop.addEventListener("change", e => { if (e.target.files.length) loadFile(e.target.files[0]); });
fileInput.addEventListener("change", e => { if (e.target.files.length) loadFile(e.target.files[0]); });

function loadFile(file) {
  loading.style.display = "flex";
  traceFileName = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    setTimeout(() => {
      try {
        const raw = JSON.parse(e.target.result);
        traceData = raw.objects || {};
        loadConfig();
        updateExcludeBtn();
        updatePinRootBtn();
        buildAndRender();
      } catch (err) {
        alert("Failed to parse JSON: " + err.message);
      }
      loading.style.display = "none";
    }, 50);
  };
  reader.readAsText(file);
}

function getClassName(ref) {
  if (ref.includes("/")) {
    const parts = ref.split(":");
    return parts[parts.length - 1] || ref;
  }
  return ref;
}

function getFileName(ref) {
  const parts = ref.split(":");
  if (parts.length >= 2) {
    const fp = parts.slice(0, -1).join(":");
    const segs = fp.split("/");
    return segs[segs.length - 1];
  }
  return ref;
}

function getOwned(obj) {
  const owns = obj.owns || {};
  if (Array.isArray(owns)) return owns.map(u => [u, ""]);
  return Object.entries(owns);
}

function getOwnedUuids(obj) {
  const owns = obj.owns || {};
  if (Array.isArray(owns)) return owns;
  return Object.keys(owns);
}

function getAttrName(obj, childUuid) {
  const owns = obj.owns || {};
  if (Array.isArray(owns)) return "";
  return owns[childUuid] || "";
}

function buildParentMap(objects) {
  const pm = {};
  for (const [uuid, obj] of Object.entries(objects)) {
    for (const child of getOwnedUuids(obj)) {
      if (!pm[child]) pm[child] = [];
      pm[child].push(uuid);
    }
  }
  return pm;
}

function buildCreationOrder(objects) {
  const order = {};
  let i = 0;
  for (const uuid of Object.keys(objects)) {
    order[uuid] = i++;
  }
  return order;
}

const _reachCache = {};
function canReach(objects, from, to, visited) {
  const key = from + ">" + to;
  if (key in _reachCache) return _reachCache[key];
  if (visited.has(from)) return false;
  visited.add(from);
  for (const child of getOwnedUuids(objects[from] || {})) {
    if (child === to || canReach(objects, child, to, visited)) {
      _reachCache[key] = true;
      return true;
    }
  }
  _reachCache[key] = false;
  return false;
}

function isPinnedRoot(uuid) {
  const obj = traceData[uuid];
  if (!obj) return false;
  return pinnedRootClasses.has(getClassName(obj.ref));
}

function buildEffectiveParentMap(objects, rawParentMap, creationOrder) {
  const ep = {};
  for (const [child, parents] of Object.entries(rawParentMap)) {
    if (isPinnedRoot(child)) continue;
    const validParents = parents.filter(p => {
      if (creationOrder[p] < creationOrder[child]) return true;
      if (!canReach(objects, child, p, new Set())) return true;
      const childOwns = (objects[child] || {}).owns || {};
      return p in childOwns;
    });
    if (validParents.length > 1) {
      const createdBy = (objects[child] || {}).created_by;
      if (createdBy && validParents.includes(createdBy)) {
        ep[child] = [createdBy];
        continue;
      }
    }
    if (validParents.length > 0) {
      ep[child] = validParents;
    }
  }
  return ep;
}

function findRoots(objects, effectiveParentMap) {
  const allUuids = Object.keys(objects);
  const roots = allUuids.filter(u => !effectiveParentMap[u] || effectiveParentMap[u].length === 0);

  const rooted = new Set();
  function markReachable(uuid, visited) {
    if (visited.has(uuid)) return;
    visited.add(uuid);
    rooted.add(uuid);
    for (const child of getOwnedUuids(objects[uuid])) {
      if (!objects[child]) continue;
      const childOwns = objects[child].owns || {};
      if (!canReach(objects, child, uuid, new Set()) || uuid in childOwns) {
        markReachable(child, visited);
      }
    }
  }
  for (const r of roots) markReachable(r, new Set());

  for (const uuid of allUuids) {
    if (!rooted.has(uuid)) {
      roots.push(uuid);
      markReachable(uuid, new Set());
    }
  }

  return roots;
}

function participatesInOwnership(uuid, objects, pm) {
  const obj = objects[uuid];
  if (getOwnedUuids(obj).length > 0) return true;
  if (pm[uuid] && pm[uuid].length > 0) return true;
  return false;
}

let creationOrder = {};
let effectiveParentMap = {};

function buildAndRender() {
  for (const k in _reachCache) delete _reachCache[k];
  parentMap = buildParentMap(traceData);
  creationOrder = buildCreationOrder(traceData);
  effectiveParentMap = buildEffectiveParentMap(traceData, parentMap, creationOrder);
  render();
  dropZone.classList.add("hidden");
  controls.classList.remove("hidden");
  hierarchy.style.display = "block";
}

function render() {
  hierarchy.innerHTML = "";
  rendered = {};
  refEdges = [];

  const filterText = filterInput.value.toLowerCase();
  const showIso = showIsolated.checked;

  let totalObjects = Object.keys(traceData).length;

  const allRoots = findRoots(traceData, effectiveParentMap);

  const rootsByProc = {};
  for (const uuid of allRoots) {
    const proc = traceData[uuid].process || "unknown";
    if (!rootsByProc[proc]) rootsByProc[proc] = [];
    rootsByProc[proc].push(uuid);
  }

  for (const [proc, rootUuids] of Object.entries(rootsByProc)) {
    const procBox = document.createElement("div");
    procBox.className = "process-box";

    const label = document.createElement("div");
    label.className = "process-label";
    label.textContent = "process " + proc.substring(0, 12) + "...";
    procBox.appendChild(label);

    const children = document.createElement("div");
    children.className = "process-children";

    const sorted = rootUuids.slice().sort((a, b) => {
      const oa = getOwnedUuids(traceData[a]).length;
      const ob = getOwnedUuids(traceData[b]).length;
      return ob - oa;
    });

    for (const uuid of sorted) {
      const el = renderObject(uuid, 0, new Set(), filterText, showIso);
      if (el) {
        children.appendChild(el);
      }
    }

    if (children.children.length > 0) {
      procBox.appendChild(children);
      hierarchy.appendChild(procBox);
    }
  }

  const totalShown = countVisible();
  statsEl.textContent = totalShown + " / " + totalObjects + " objects shown";

  requestAnimationFrame(() => scheduleEdgeLayout());
}

function countVisible() {
  return hierarchy.querySelectorAll(".obj-box:not(.hidden)").length;
}

function matchesFilter(uuid, filterText) {
  if (!filterText) return true;
  const obj = traceData[uuid];
  const name = getClassName(obj.ref).toLowerCase();
  return name.includes(filterText);
}

function subtreeMatchesFilter(uuid, filterText, visited) {
  if (visited.has(uuid)) return false;
  visited.add(uuid);
  if (matchesFilter(uuid, filterText)) return true;
  const obj = traceData[uuid];
  for (const child of getOwnedUuids(obj)) {
    if (traceData[child] && subtreeMatchesFilter(child, filterText, visited)) return true;
  }
  return false;
}

function isExcluded(uuid) {
  const obj = traceData[uuid];
  if (!obj) return false;
  return excludedClasses.has(getClassName(obj.ref));
}

function renderObject(uuid, depth, visited, filterText, showIso, attrName, skipOwned) {
  const obj = traceData[uuid];
  if (!obj) return null;

  if (isExcluded(uuid)) return null;

  if (!showIso && !participatesInOwnership(uuid, traceData, parentMap)) return null;

  if (visited.has(uuid)) {
    if (!subtreeMatchesFilter(uuid, filterText, new Set())) return null;
    return renderRef(uuid, attrName);
  }

  if (rendered[uuid]) {
    if (!subtreeMatchesFilter(uuid, filterText, new Set())) return null;
    return renderRef(uuid, attrName);
  }

  if (!subtreeMatchesFilter(uuid, filterText, new Set(visited))) return null;

  visited.add(uuid);
  rendered[uuid] = true;

  const box = document.createElement("div");
  box.className = "obj-box depth-" + (depth % 7);
  box.dataset.uuid = uuid;

  const label = document.createElement("div");
  label.className = "obj-label";
  const className = getClassName(obj.ref);
  label.textContent = attrName ? attrName + ": " + className : className;
  box.appendChild(label);

  box._className = className;

  if (collapsedSet.has(uuid)) box.classList.add("collapsed");

  label.addEventListener("click", e => {
    e.stopPropagation();
    toggleCollapse(uuid, box);
  });

  box.addEventListener("mouseenter", e => showTooltip(e, uuid));
  box.addEventListener("mousemove", e => moveTooltip(e));
  box.addEventListener("mouseleave", () => hideTooltip());

  const ownedEntries = getOwned(obj).filter(([c]) => c !== skipOwned);
  if (ownedEntries.length > 0) {
    const childrenDiv = document.createElement("div");
    childrenDiv.className = "obj-children";

    const sortedOwns = ownedEntries.slice().sort((a, b) => {
      const oa = traceData[a[0]] ? getOwnedUuids(traceData[a[0]]).length : 0;
      const ob = traceData[b[0]] ? getOwnedUuids(traceData[b[0]]).length : 0;
      return ob - oa;
    });

    let hasVisibleChild = false;
    for (const [child, childAttr] of sortedOwns) {
      let el;
      if (isPinnedRoot(child)) {
        if (!subtreeMatchesFilter(child, filterText, new Set())) continue;
        el = renderRef(child, childAttr);
      } else if (traceData[child] && canReach(traceData, child, uuid, new Set())) {
        const childOwns = traceData[child].owns || {};
        if (uuid in childOwns) {
          el = renderObject(child, depth + 1, new Set(visited), filterText, showIso, childAttr, uuid);
        } else {
          if (!subtreeMatchesFilter(child, filterText, new Set())) continue;
          el = renderRef(child, childAttr);
        }
      } else {
        el = renderObject(child, depth + 1, new Set(visited), filterText, showIso, childAttr);
      }
      if (el) {
        childrenDiv.appendChild(el);
        hasVisibleChild = true;
      }
    }

    if (hasVisibleChild) {
      box.appendChild(childrenDiv);
    }
  }

  return box;
}

function renderRef(uuid, attrName) {
  const obj = traceData[uuid];
  if (!obj) return null;
  if (isExcluded(uuid)) return null;

  const el = document.createElement("div");
  el.className = "obj-ref";
  const className = getClassName(obj.ref);
  el.textContent = (attrName ? attrName + ": " : "") + className + " ⇗";
  el.dataset.uuid = uuid;
  el.dataset.refTarget = uuid;

  el.addEventListener("mouseenter", e => {
    showTooltip(e, uuid);
    highlightEdges(uuid, el);
  });
  el.addEventListener("mousemove", e => moveTooltip(e));
  el.addEventListener("mouseleave", () => {
    hideTooltip();
    clearEdgeHighlights();
  });

  el.addEventListener("click", () => {
    const target = hierarchy.querySelector(`.obj-box[data-uuid="${uuid}"]`);
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.style.outline = "2px solid #5a9";
      setTimeout(() => target.style.outline = "", 1500);
    }
  });

  return el;
}

// --- Edge routing with ELK ---

let edgeLayoutTimer = null;

function scheduleEdgeLayout() {
  clearTimeout(edgeLayoutTimer);
  edgeLayoutTimer = setTimeout(layoutEdges, 100);
}

const EDGE_OFFSET_PX = 5;

function findRootBox(el) {
  let node = el.closest(".obj-box");
  while (node) {
    if (node.parentElement && node.parentElement.classList.contains("process-children")) return node;
    node = node.parentElement ? node.parentElement.closest(".obj-box") : null;
  }
  return null;
}

function elRect(el, hRect, scrollLeft, scrollTop) {
  const r = el.getBoundingClientRect();
  return {
    x: r.left - hRect.left + scrollLeft,
    y: r.top - hRect.top + scrollTop,
    w: r.width,
    h: r.height,
  };
}

function nearestSide(innerPt, box) {
  const dLeft   = innerPt.x - box.x;
  const dRight  = (box.x + box.w) - innerPt.x;
  const dTop    = innerPt.y - box.y;
  const dBottom = (box.y + box.h) - innerPt.y;
  const min = Math.min(dLeft, dRight, dTop, dBottom);
  if (min === dRight)  return "right";
  if (min === dLeft)   return "left";
  if (min === dBottom) return "bottom";
  return "top";
}

function sideExitPoint(box, side, offset) {
  switch (side) {
    case "right":  return { x: box.x + box.w, y: box.y + box.h / 2 + offset };
    case "left":   return { x: box.x,         y: box.y + box.h / 2 + offset };
    case "bottom": return { x: box.x + box.w / 2 + offset, y: box.y + box.h };
    case "top":    return { x: box.x + box.w / 2 + offset, y: box.y };
  }
}

function boxEdgePoint(rect, toward) {
  const cx = rect.x + rect.w / 2;
  const cy = rect.y + rect.h / 2;
  const dx = toward.x - cx;
  const dy = toward.y - cy;
  if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) return { x: cx, y: cy };
  const scaleX = rect.w / 2 / Math.abs(dx || 1);
  const scaleY = rect.h / 2 / Math.abs(dy || 1);
  const scale = Math.min(scaleX, scaleY);
  return { x: cx + dx * scale, y: cy + dy * scale };
}

function orthogonalToSide(pt, exitPt, side) {
  if (side === "right" || side === "left") {
    return [pt, { x: exitPt.x, y: pt.y }, { x: exitPt.x, y: exitPt.y }];
  }
  return [pt, { x: pt.x, y: exitPt.y }, { x: exitPt.x, y: exitPt.y }];
}

function assignOffsets(edgeGroups) {
  for (const [, edges] of Object.entries(edgeGroups)) {
    const n = edges.length;
    if (n === 0) continue;
    edges.sort((a, b) => a.sortKey - b.sortKey);
    const half = (n - 1) / 2;
    for (let i = 0; i < n; i++) {
      edges[i].offset = (i - half) * EDGE_OFFSET_PX;
    }
  }
}

function layoutEdges() {
  const refEls = hierarchy.querySelectorAll(".obj-ref[data-ref-target]");
  if (refEls.length === 0) { clearEdgeSvg(); return; }

  const hRect = hierarchy.getBoundingClientRect();
  const scrollLeft = hierarchy.scrollLeft || 0;
  const scrollTop = hierarchy.scrollTop || 0;

  const edgeInfos = [];

  for (const refEl of refEls) {
    const targetUuid = refEl.dataset.refTarget;
    const targetEl = hierarchy.querySelector(`.obj-box[data-uuid="${targetUuid}"]`);
    if (!targetEl) continue;

    const srcRoot = findRootBox(refEl);
    const tgtRoot = findRootBox(targetEl);
    if (!srcRoot || !tgtRoot) continue;

    edgeInfos.push({
      refEl,
      targetEl,
      targetUuid,
      srcRoot,
      tgtRoot,
      sameRoot: srcRoot === tgtRoot,
      refRect: elRect(refEl, hRect, scrollLeft, scrollTop),
      tgtRect: elRect(targetEl, hRect, scrollLeft, scrollTop),
      srcRootRect: elRect(srcRoot, hRect, scrollLeft, scrollTop),
      tgtRootRect: elRect(tgtRoot, hRect, scrollLeft, scrollTop),
    });
  }

  if (edgeInfos.length === 0) { clearEdgeSvg(); return; }

  const crossEdges = edgeInfos.filter(e => !e.sameRoot);
  const sameEdges = edgeInfos.filter(e => e.sameRoot);

  const rootBoxMap = new Map();
  const allRootBoxes = hierarchy.querySelectorAll(":scope > .process-box > .process-children > .obj-box");
  let rbIdx = 0;
  for (const rb of allRootBoxes) {
    if (!rootBoxMap.has(rb)) {
      rootBoxMap.set(rb, { id: "rb_" + rbIdx++, rect: elRect(rb, hRect, scrollLeft, scrollTop) });
    }
  }

  const elkEdges = crossEdges.map((e, i) => ({
    id: "e_" + i,
    sources: [rootBoxMap.get(e.srcRoot).id],
    targets: [rootBoxMap.get(e.tgtRoot).id],
    info: e,
  }));

  const NODE_PADDING = 8;
  const elkNodes = [];
  for (const [, { id, rect }] of rootBoxMap) {
    elkNodes.push({
      id,
      x: rect.x - NODE_PADDING,
      y: rect.y - NODE_PADDING,
      width: rect.w + NODE_PADDING * 2,
      height: rect.h + NODE_PADDING * 2,
    });
  }

  const elkGraph = {
    id: "root",
    layoutOptions: {
      "elk.algorithm": "fixed",
      "elk.edgeRouting": "ORTHOGONAL",
      "elk.spacing.edgeEdge": "8",
      "elk.spacing.edgeNode": "12",
      "elk.spacing.nodeNode": "16",
    },
    children: elkNodes,
    edges: elkEdges.map(e => ({ id: e.id, sources: e.sources, targets: e.targets })),
  };

  elk.layout(elkGraph).then(result => {
    const elkEdgeMap = {};
    if (result.edges) for (const e of result.edges) elkEdgeMap[e.id] = e;

    const srcExitGroups = {};
    const tgtEntryGroups = {};

    for (const ee of elkEdges) {
      const info = ee.info;
      const srcCenter = { x: info.refRect.x + info.refRect.w / 2, y: info.refRect.y + info.refRect.h / 2 };
      const tgtCenter = { x: info.tgtRect.x + info.tgtRect.w / 2, y: info.tgtRect.y + info.tgtRect.h / 2 };

      const elkEdge = elkEdgeMap[ee.id];
      let firstExtPt, lastExtPt;
      if (elkEdge && elkEdge.sections && elkEdge.sections.length > 0) {
        const sec = elkEdge.sections[0];
        firstExtPt = sec.bendPoints && sec.bendPoints.length > 0 ? sec.bendPoints[0] : sec.endPoint;
        lastExtPt = sec.bendPoints && sec.bendPoints.length > 0 ? sec.bendPoints[sec.bendPoints.length - 1] : sec.startPoint;
      } else {
        firstExtPt = tgtCenter;
        lastExtPt = srcCenter;
      }

      const srcSide = nearestSide(srcCenter, info.srcRootRect);
      const tgtSide = nearestSide(tgtCenter, info.tgtRootRect);

      const srcKey = rootBoxMap.get(info.srcRoot).id + "_" + srcSide;
      const tgtKey = rootBoxMap.get(info.tgtRoot).id + "_" + tgtSide;

      if (!srcExitGroups[srcKey]) srcExitGroups[srcKey] = [];
      srcExitGroups[srcKey].push({
        edge: ee,
        sortKey: (srcSide === "top" || srcSide === "bottom") ? srcCenter.x : srcCenter.y,
        offset: 0,
      });

      if (!tgtEntryGroups[tgtKey]) tgtEntryGroups[tgtKey] = [];
      tgtEntryGroups[tgtKey].push({
        edge: ee,
        sortKey: (tgtSide === "top" || tgtSide === "bottom") ? tgtCenter.x : tgtCenter.y,
        offset: 0,
      });

      ee._srcSide = srcSide;
      ee._tgtSide = tgtSide;
      ee._elkEdge = elkEdge;
    }

    assignOffsets(srcExitGroups);
    assignOffsets(tgtEntryGroups);

    const srcOffsetMap = {};
    for (const entries of Object.values(srcExitGroups))
      for (const entry of entries) srcOffsetMap[entry.edge.id] = entry.offset;
    const tgtOffsetMap = {};
    for (const entries of Object.values(tgtEntryGroups))
      for (const entry of entries) tgtOffsetMap[entry.edge.id] = entry.offset;

    const paths = [];

    for (const ee of elkEdges) {
      const info = ee.info;

      const exitPt = sideExitPoint(info.srcRootRect, ee._srcSide, srcOffsetMap[ee.id] || 0);
      const entryPt = sideExitPoint(info.tgtRootRect, ee._tgtSide, tgtOffsetMap[ee.id] || 0);

      const srcEdge = boxEdgePoint(info.refRect, exitPt);
      const tgtEdge = boxEdgePoint(info.tgtRect, entryPt);

      const srcPath = orthogonalToSide(srcEdge, exitPt, ee._srcSide);
      const tgtPath = orthogonalToSide(tgtEdge, entryPt, ee._tgtSide).reverse();

      let midPath = [];
      const elkE = ee._elkEdge;
      if (elkE && elkE.sections && elkE.sections.length > 0) {
        const sec = elkE.sections[0];
        if (sec.bendPoints) midPath = sec.bendPoints.map(p => ({ x: p.x, y: p.y }));
      }

      const allPts = [...srcPath, ...midPath, ...tgtPath];
      const clean = [allPts[0]];
      for (let i = 1; i < allPts.length; i++) {
        const prev = clean[clean.length - 1];
        if (Math.abs(prev.x - allPts[i].x) > 0.5 || Math.abs(prev.y - allPts[i].y) > 0.5) {
          clean.push(allPts[i]);
        }
      }

      paths.push({ pts: clean, targetUuid: info.targetUuid, id: ee.id });
    }

    for (const se of sameEdges) {
      const midX = Math.max(se.refRect.x + se.refRect.w, se.tgtRect.x + se.tgtRect.w) + 20;
      const srcEdge = boxEdgePoint(se.refRect, { x: midX, y: se.refRect.y + se.refRect.h / 2 });
      const tgtEdge = boxEdgePoint(se.tgtRect, { x: midX, y: se.tgtRect.y + se.tgtRect.h / 2 });
      paths.push({
        pts: [srcEdge, { x: midX, y: srcEdge.y }, { x: midX, y: tgtEdge.y }, tgtEdge],
        targetUuid: se.targetUuid,
        id: "same_" + paths.length,
      });
    }

    drawPaths(paths);
  }).catch(() => {
    const paths = [];
    for (const info of edgeInfos) {
      const midX = Math.max(info.refRect.x + info.refRect.w, info.tgtRect.x + info.tgtRect.w) + 20;
      const srcEdge = boxEdgePoint(info.refRect, { x: midX, y: info.refRect.y + info.refRect.h / 2 });
      const tgtEdge = boxEdgePoint(info.tgtRect, { x: midX, y: info.tgtRect.y + info.tgtRect.h / 2 });
      paths.push({
        pts: [srcEdge, { x: midX, y: srcEdge.y }, { x: midX, y: tgtEdge.y }, tgtEdge],
        targetUuid: info.targetUuid,
        id: "fb_" + paths.length,
      });
    }
    drawPaths(paths);
  });
}

function drawPaths(paths) {
  clearEdgeSvg();
  const svgNs = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNs, "svg");
  svg.id = "edge-svg";
  svg.setAttribute("width", hierarchy.scrollWidth);
  svg.setAttribute("height", hierarchy.scrollHeight);

  const defs = document.createElementNS(svgNs, "defs");
  const marker = document.createElementNS(svgNs, "marker");
  marker.setAttribute("id", "arrowhead");
  marker.setAttribute("markerWidth", "8");
  marker.setAttribute("markerHeight", "6");
  marker.setAttribute("refX", "8");
  marker.setAttribute("refY", "3");
  marker.setAttribute("orient", "auto");
  const arrow = document.createElementNS(svgNs, "path");
  arrow.setAttribute("d", "M0,0 L8,3 L0,6 Z");
  marker.appendChild(arrow);
  defs.appendChild(marker);
  svg.appendChild(defs);

  for (const p of paths) {
    const d = "M" + p.pts.map(pt => pt.x + "," + pt.y).join(" L");
    const path = document.createElementNS(svgNs, "path");
    path.setAttribute("d", d);
    path.setAttribute("marker-end", "url(#arrowhead)");
    path.dataset.edgeId = p.id;
    path.dataset.targetUuid = p.targetUuid;
    svg.appendChild(path);
  }

  hierarchy.appendChild(svg);
}

function clearEdgeSvg() {
  const old = document.getElementById("edge-svg");
  if (old) old.remove();
}

function highlightEdges(targetUuid, refEl) {
  const svg = document.getElementById("edge-svg");
  if (!svg) return;
  for (const path of svg.querySelectorAll("path[data-target-uuid]")) {
    if (path.dataset.targetUuid === targetUuid) {
      path.classList.add("edge-highlight");
    }
  }
}

function clearEdgeHighlights() {
  const svg = document.getElementById("edge-svg");
  if (!svg) return;
  for (const path of svg.querySelectorAll(".edge-highlight")) {
    path.classList.remove("edge-highlight");
  }
}

// --- Tooltips ---

function showTooltip(e, uuid) {
  const obj = traceData[uuid];
  if (!obj) return;

  const ownedUuids = getOwnedUuids(obj);
  const parents = effectiveParentMap[uuid] || [];
  const backRefs = (parentMap[uuid] || []).filter(p => !parents.includes(p));

  let html = `<span class="tt-key">class:</span> <span class="tt-val">${getClassName(obj.ref)}</span><br>`;
  html += `<span class="tt-key">file:</span> <span class="tt-val">${obj.ref.split(":").slice(0, -1).join(":")}</span><br>`;
  html += `<span class="tt-key">uuid:</span> <span class="tt-val">${uuid}</span><br>`;
  html += `<span class="tt-key">owns:</span> <span class="tt-val">${ownedUuids.length} object${ownedUuids.length !== 1 ? "s" : ""}</span><br>`;
  html += `<span class="tt-key">owned by:</span> <span class="tt-val">${parents.length > 0 ? parents.map(p => getClassName(traceData[p].ref)).join(", ") : "none (root)"}</span>`;
  if (backRefs.length > 0) {
    html += `<br><span class="tt-key">back-refs:</span> <span class="tt-val">${backRefs.map(p => getClassName(traceData[p].ref)).join(", ")}</span>`;
  }

  tooltip.innerHTML = html;
  tooltip.classList.remove("hidden");
  moveTooltip(e);
}

function moveTooltip(e) {
  let x = e.clientX + 12;
  let y = e.clientY + 12;
  const rect = tooltip.getBoundingClientRect();
  if (x + rect.width > window.innerWidth) x = e.clientX - rect.width - 12;
  if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - 12;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}

function hideTooltip() {
  tooltip.classList.add("hidden");
}

let filterTimeout = null;
filterInput.addEventListener("input", () => {
  clearTimeout(filterTimeout);
  filterTimeout = setTimeout(() => { render(); }, 200);
});
showIsolated.addEventListener("change", render);

window.addEventListener("resize", scheduleEdgeLayout);
window.addEventListener("scroll", scheduleEdgeLayout, true);

// --- Exclude classes panel ---

const excludeBtn = document.getElementById("exclude-btn");
const excludePanel = document.getElementById("exclude-panel");
const excludeFilter = document.getElementById("exclude-filter");
const excludeList = document.getElementById("exclude-list");

excludeBtn.addEventListener("click", e => {
  e.stopPropagation();
  excludePanel.classList.toggle("hidden");
  if (!excludePanel.classList.contains("hidden")) {
    populateExcludePanel();
    excludeFilter.focus();
  }
});

document.addEventListener("click", e => {
  if (!excludePanel.contains(e.target) && e.target !== excludeBtn) {
    excludePanel.classList.add("hidden");
  }
});

excludeFilter.addEventListener("click", e => e.stopPropagation());
excludeFilter.addEventListener("input", () => populateExcludePanel());

function updateExcludeBtn() {
  const n = excludedClasses.size;
  excludeBtn.textContent = n > 0 ? `Exclude classes (${n}) ▾` : "Exclude classes ▾";
}

function getClassCounts() {
  const counts = {};
  for (const obj of Object.values(traceData || {})) {
    const name = getClassName(obj.ref);
    counts[name] = (counts[name] || 0) + 1;
  }
  return counts;
}

function populateExcludePanel() {
  const counts = getClassCounts();
  const search = excludeFilter.value.toLowerCase();
  const sorted = Object.entries(counts)
    .filter(([name]) => !search || name.toLowerCase().includes(search))
    .sort((a, b) => a[0].localeCompare(b[0]));

  excludeList.innerHTML = "";
  for (const [name, count] of sorted) {
    const row = document.createElement("label");
    row.style.cssText = "display:flex; align-items:center; gap:6px; padding:3px 10px; cursor:pointer; font-size:12px;";
    row.addEventListener("mouseenter", () => row.style.background = "#2a2a2a");
    row.addEventListener("mouseleave", () => row.style.background = "");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = excludedClasses.has(name);
    cb.style.accentColor = "#c55";
    cb.addEventListener("change", () => {
      if (cb.checked) excludedClasses.add(name);
      else excludedClasses.delete(name);
      saveConfig();
      updateExcludeBtn();
      render();
    });

    const text = document.createElement("span");
    text.textContent = name;
    text.style.flex = "1";

    const badge = document.createElement("span");
    badge.textContent = count;
    badge.style.cssText = "color:#666; font-size:11px;";

    row.appendChild(cb);
    row.appendChild(text);
    row.appendChild(badge);
    excludeList.appendChild(row);
  }
}

// --- Pin as root panel ---

const pinRootBtn = document.getElementById("pin-root-btn");
const pinRootPanel = document.getElementById("pin-root-panel");
const pinRootFilter = document.getElementById("pin-root-filter");
const pinRootList = document.getElementById("pin-root-list");

pinRootBtn.addEventListener("click", e => {
  e.stopPropagation();
  pinRootPanel.classList.toggle("hidden");
  if (!pinRootPanel.classList.contains("hidden")) {
    populatePinRootPanel();
    pinRootFilter.focus();
  }
});

document.addEventListener("click", e => {
  if (!pinRootPanel.contains(e.target) && e.target !== pinRootBtn) {
    pinRootPanel.classList.add("hidden");
  }
});

pinRootFilter.addEventListener("click", e => e.stopPropagation());
pinRootFilter.addEventListener("input", () => populatePinRootPanel());

function updatePinRootBtn() {
  const n = pinnedRootClasses.size;
  pinRootBtn.textContent = n > 0 ? `Roots (${n}) ▾` : "Roots ▾";
}

function populatePinRootPanel() {
  const counts = getClassCounts();
  const search = pinRootFilter.value.toLowerCase();
  const sorted = Object.entries(counts)
    .filter(([name]) => !search || name.toLowerCase().includes(search))
    .sort((a, b) => a[0].localeCompare(b[0]));

  pinRootList.innerHTML = "";
  for (const [name, count] of sorted) {
    const row = document.createElement("label");
    row.style.cssText = "display:flex; align-items:center; gap:6px; padding:3px 10px; cursor:pointer; font-size:12px;";
    row.addEventListener("mouseenter", () => row.style.background = "#2a2a2a");
    row.addEventListener("mouseleave", () => row.style.background = "");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = pinnedRootClasses.has(name);
    cb.style.accentColor = "#59a";
    cb.addEventListener("change", () => {
      if (cb.checked) pinnedRootClasses.add(name);
      else pinnedRootClasses.delete(name);
      saveConfig();
      updatePinRootBtn();
      buildAndRender();
    });

    const text = document.createElement("span");
    text.textContent = name;
    text.style.flex = "1";

    const badge = document.createElement("span");
    badge.textContent = count;
    badge.style.cssText = "color:#666; font-size:11px;";

    row.appendChild(cb);
    row.appendChild(text);
    row.appendChild(badge);
    pinRootList.appendChild(row);
  }
}
</script>
