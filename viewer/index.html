<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omni-tracer object hierarchy</title>
</head>
<body>

<div id="controls" class="hidden">
  <label id="file-input-label">
    Open New Trace
    <input type="file" id="file-input" accept=".json">
  </label>
  <input type="text" id="filter-input" placeholder="Filter by class name...">
  <label>
    <input type="checkbox" id="show-isolated">
    Show isolated objects
  </label>
  <div style="position: relative; display: inline-block;">
    <button id="exclude-btn" class="dropdown-btn">Exclude classes &#x25BE;</button>
    <div id="exclude-panel" class="dropdown-panel hidden">
      <div class="dropdown-search">
        <input type="text" id="exclude-filter" placeholder="Search classes...">
      </div>
      <div id="exclude-list"></div>
    </div>
  </div>
  <div style="position: relative; display: inline-block;">
    <button id="pin-root-btn" class="dropdown-btn">Roots &#x25BE;</button>
    <div id="pin-root-panel" class="dropdown-panel hidden">
      <div class="dropdown-search">
        <input type="text" id="pin-root-filter" placeholder="Search classes...">
      </div>
      <div id="pin-root-list"></div>
    </div>
  </div>
  <div style="position: relative; display: inline-block;">
    <button id="root-order-btn" class="dropdown-btn">Root order &#x25BE;</button>
    <div id="root-order-panel" class="dropdown-panel hidden">
      <div class="dropdown-search">
        <input type="text" id="root-order-filter" placeholder="Search classes...">
      </div>
      <div id="root-order-list"></div>
    </div>
  </div>
  <div style="position: relative; display: inline-block;">
    <button id="call-chain-btn" class="dropdown-btn">Call chain &#x25BE;</button>
    <div id="call-chain-panel" class="dropdown-panel hidden">
      <div class="dropdown-search">
        <input type="text" id="call-chain-filter" placeholder="Search functions...">
      </div>
      <div id="call-chain-list"></div>
    </div>
  </div>
  <button id="reset-layout-btn" class="dropdown-btn">Reset Layout</button>
  <span id="stats"></span>
</div>

<div id="drop-zone">
  Drop a trace JSON here, or click to load
  <input type="file" id="file-input-drop" accept=".json" style="display:none">
</div>

<div id="hierarchy"></div>

<div id="loading">Parsing trace...</div>

<div id="tooltip" class="tooltip hidden"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
