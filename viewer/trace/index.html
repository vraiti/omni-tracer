<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omni-tracer function trace</title>
</head>
<body>

<div id="controls">
  <label id="file-input-label">
    Open Trace
    <input type="file" id="file-input" accept=".json">
  </label>
  <div style="position: relative; display: inline-block;">
    <input type="text" id="root-input" placeholder="Search for a function...">
    <div id="root-dropdown" class="dropdown-panel hidden">
      <div id="root-list"></div>
    </div>
  </div>
  <span id="stats"></span>
</div>

<div id="drop-zone">
  Drop a trace JSON here, or click to load
  <input type="file" id="file-input-drop" accept=".json" style="display:none">
</div>

<div id="trace-container"></div>

<svg id="trace-edge-svg"></svg>

<div id="loading">Parsing trace...</div>

<script type="module" src="/src/trace-main.ts"></script>
</body>
</html>
